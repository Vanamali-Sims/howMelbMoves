version: 2

models:
  - name: mart_precinct_hour
    description: >
      Hourly footfall summed by CLUE small area (precinct). Sensor assignment
      follows int_sensor_block_map (ADR-010).
    columns:
      - name: precinct
        data_tests: [not_null]
      - name: sensing_date
        data_tests: [not_null]
      - name: hourday
        data_tests: [not_null]
      - name: pedestriancount
        data_tests: [not_null]
      - name: sensor_count
        data_tests: [not_null]
      - name: is_public_holiday
        data_tests: [not_null]
      - name: is_school_term
        data_tests: [not_null]
      - name: is_event_day
        data_tests: [not_null]

# Populated from live API responses on 2026-09-06.
# See docs/source_verification.md. Do not add unverified endpoints.
sources:
  - name: pedestrian_hourly_counts
    base_url: https://data.melbourne.vic.gov.au
    dataset_id: pedestrian-counting-system-monthly-counts-per-hour
    expected_columns:
      - id
      - location_id
      - sensing_date
      - hourday
      - direction_1
      - direction_2
      - pedestriancount
      - sensor_name
      - location
    # Live min/max sensing_date, not the portal's "since 2009" claim.
    date_range:
      start: 2024-09-06
      end: 2026-09-05
    verified: true

  - name: pedestrian_sensor_locations
    base_url: https://data.melbourne.vic.gov.au
    dataset_id: pedestrian-counting-system-sensor-locations
    expected_columns:
      - location_id
      - sensor_description
      - sensor_name
      - installation_date
      - note
      - location_type
      - status
      - direction_1
      - direction_2
      - latitude
      - longitude
      - location
    # Extrema of installation_date among rows that have one (131 of 134).
    date_range:
      start: 2009-01-20
      end: 2025-10-18
    verified: true


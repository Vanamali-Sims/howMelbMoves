[project]
name = "melbourne-footfall"
version = "0.1.0"
description = "Forecast hourly pedestrian volume in the Melbourne CBD and quantify post-lockdown recovery by precinct."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-duckdb>=1.8",
    "duckdb>=1.1",
    "lightgbm>=4.5",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/melbourne_footfall"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
